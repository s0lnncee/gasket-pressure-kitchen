<title>Gasket's Pressure Kitchen</title>
<style>
:root {
  color-scheme: dark;
  background: #0D0908;
  color: #F3EEE9;
  font-family: monospace;
}
* {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  outline: none;
}
#replay {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  padding: 15px 34px;
  border: 1px solid #FFB35C;
  border-radius: 3px;
  background: #F05A18;
  color: #0D0908;
  font: bold 17px monospace;
  cursor: pointer;
}
#replay:hover {
  background: #FFB35C;
}
#mute:focus-visible, #replay:focus-visible {
  outline: 3px solid #F3EEE9;
  outline-offset: 5px;
}
#mute {
  position: fixed;
  right: 10px;
  top: 8px;
  padding: 6px 10px;
  border: 1px solid #9C7B62;
  border-radius: 3px;
  background: #140D0B;
  color: #FFB35C;
  font: 12px monospace;
  cursor: pointer;
}
[hidden] {
  display: none !important;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}
</style>

<body>
<canvas id="kitchen" tabindex="0" aria-label="Gasket's Pressure Kitchen"
  aria-describedby="instructions"></canvas>
<p id="instructions" class="sr-only">
  Hold anywhere to vent. Release to heat. Cook five dishes. Tap Play again after the result.
</p>
<p id="announcement" class="sr-only" aria-live="polite"></p>
<button id="mute" type="button" aria-pressed="false" aria-label="Mute sound">Sound on</button>
<button id="replay" type="button" hidden>Play again</button>
<script id="sim">
/* Pure service simulation: no DOM, audio, randomness or hidden state. */
globalThis.KitchenPhysics = (() => {
  'use strict';

  const SETTINGS = Object.freeze({
    maxPSI: 100,
    zoneLow: 65,
    zoneHigh: 85,
    warningPSI: 90,
    initialPSI: 58,
    heatBase: 7.5,
    heatRamp: 0.09,
    heatAcceleration: 0.0005,
    ventForce: 37,
    ventCurve: 2,
    warmupSeconds: 10,
    warmupHeat: 2.5,
    pressureResponse: 3.5,
    spring: 180,
    damping: 25,
    surgeEvery: 7,
    surgeDuration: 2,
    surgeForce: 2,
    pointsPerSecond: 100,
    comboSeconds: 3,
    comboMax: 5,
    step: 1 / 120,
    batchPause: 1.2,
    dishBonus: 500,
    surgeWarningSeconds: 1.4,
    batches: Object.freeze([
      { low: 65, high: 85, heat: 0, seconds: 6.5, surge: 2 },
      { low: 68, high: 82, heat: 1, seconds: 6.5, surge: 2.5 },
      { low: 70, high: 80, heat: 2, seconds: 12, surge: 3 },
      { low: 71, high: 79, heat: 3, seconds: 12, surge: 3.5 },
      { low: 72, high: 78, heat: 4, seconds: 12, surge: 4 }
    ].map(Object.freeze))
  });

  function create(best = 0) {
    return {
      phase: 'ready',
      pressure: SETTINGS.initialPSI,
      velocity: 0,
      heat: SETTINGS.heatBase,
      elapsed: 0,
      score: 0,
      best,
      combo: 1,
      zoneTime: 0,
      inZone: false,
      lever: 0,
      leverVelocity: 0,
      surge: 0,
      surgeWarning: false,
      batchIndex: 0,
      batchTime: 0,
      cookTime: 0,
      dishes: 0,
      pauseTime: 0
    };
  }

  function batch(state) {
    return SETTINGS.batches[state.batchIndex];
  }

  function heat(state) {
    const ignition = Math.min(1, state.elapsed / SETTINGS.warmupSeconds);
    const warmup = SETTINGS.warmupHeat / SETTINGS.heatBase;
    return (SETTINGS.heatBase + state.elapsed * SETTINGS.heatRamp
      + state.elapsed ** 2 * SETTINGS.heatAcceleration + batch(state).heat)
      * (warmup + (1 - warmup) * ignition);
  }

  function score(state, dt) {
    const target = batch(state);
    state.inZone = state.pressure >= target.low && state.pressure <= target.high;
    state.zoneTime = state.inZone ? state.zoneTime + dt : 0;
    state.combo = Math.min(SETTINGS.comboMax, 1 + Math.floor(state.zoneTime / SETTINGS.comboSeconds));
    if (state.inZone) {
      state.score += SETTINGS.pointsPerSecond * state.combo * dt;
      state.cookTime = Math.min(batch(state).seconds, state.cookTime + dt);
    }
  }

  function step(state, dt, venting) {
    if (!(dt > 0) || dt > 0.1) {
      throw new Error('Simulation step must be greater than zero and at most 0.1 seconds.');
    }
    const target = state.phase === 'cooking' && venting ? 1 : 0;
    state.leverVelocity += ((target - state.lever) * SETTINGS.spring - state.leverVelocity * SETTINGS.damping) * dt;
    state.lever = Math.max(0, Math.min(1, state.lever + state.leverVelocity * dt));
    if (state.lever === 0 || state.lever === 1) {
      state.leverVelocity = 0;
    }
    if (state.phase === 'batch') {
      state.elapsed += dt;
      state.pauseTime = Math.max(0, state.pauseTime - dt);
      if (state.pauseTime === 0) {
        state.batchIndex++;
        state.batchTime = 0;
        state.cookTime = 0;
        state.pressure = (batch(state).low + batch(state).high) / 2;
        state.velocity = 0;
        state.heat = heat(state);
        state.phase = 'cooking';
      }
      return;
    }
    if (state.phase !== 'cooking') return;

    state.elapsed += dt;
    state.batchTime += dt;
    // Heat and narrower target bands change control demands, not just the display.
    state.heat = heat(state);
    const surgePhase = state.batchTime % SETTINGS.surgeEvery;
    state.surgeWarning = surgePhase >= SETTINGS.surgeEvery - SETTINGS.surgeWarningSeconds;
    state.surge = state.batchTime >= SETTINGS.surgeEvery && surgePhase < SETTINGS.surgeDuration
      ? Math.sin(surgePhase / SETTINGS.surgeDuration * Math.PI) * (batch(state).surge + state.elapsed * 0.025)
      : 0;
    // Progressive valve opening: short pulls trim pressure; a full pull vents hard.
    const cooling = state.lever ** SETTINGS.ventCurve * SETTINGS.ventForce;
    const targetVelocity = state.heat + state.surge - cooling;
    state.velocity += (targetVelocity - state.velocity) * SETTINGS.pressureResponse * dt;
    state.pressure = Math.max(0, Math.min(SETTINGS.maxPSI, state.pressure + state.velocity * dt));
    if (state.pressure === 0) {
      state.velocity = Math.max(0, state.velocity);
    }
    score(state, dt);
    if (state.pressure === SETTINGS.maxPSI) {
      state.phase = 'gameover';
      state.best = Math.max(state.best, Math.floor(state.score));
    } else if (state.cookTime >= batch(state).seconds) {
      state.dishes++;
      state.score += SETTINGS.dishBonus;
      state.surge = 0;
      state.surgeWarning = false;
      state.velocity = 0;
      state.pauseTime = SETTINGS.batchPause;
      state.phase = state.dishes === SETTINGS.batches.length ? 'victory' : 'batch';
      if (state.phase === 'victory') {
        state.best = Math.max(state.best, Math.floor(state.score));
      }
    }
  }

  return Object.freeze({ SETTINGS, create, step, score, batch });
})();
</script>
<script>
'use strict';
// CONFIG: all gameplay values and scene geometry live here, in logical units.
const CONFIG = {

  maxFrame: 0.1,
  particleLimit: 220,
  storageKey: 'gasket-best-v1',
  overlayDelay: 0.85,
  feedbackDuration: 1.2,
  pressPuffCount: 12,
  burstParticleCount: 95,
  hintFadeSpeed: 1.4,
  celebrationSeconds: 1.2,
  sound: {

    volume: 0.14,
    hissVolume: 0.035,
    alarmInterval: 0.9,
    beepSeconds: 0.13,
    chimeSeconds: 0.22
  },
  colors: {

  },
  layout: {
    landscape: {

      leverY: .71,

    },
    portrait: {

    },
    pod: {

    },
    lever: {

      pivotY: 22,
      arm: 145,
      travel: 1.03,
      rest: -.5,
      hitW: 180,
      hitH: 290
    },
    gauge: {
      start: Math.PI * .75,
      sweep: Math.PI * 1.5,
      tickCount: 50
    },
    victory: {
      w: 780,
      h: 590,
      titleY: -210,
      dishY: -105,
      dishSpacing: 88,
      dishRadius: 28,
      lightDelay: .32,
      scoreY: -12,
      chefX: -245,
      chefY: 105,
      chefScale: .60,
      sparkleCount: 22
    },
    popup: { y: -.46, font: 18 },
    overlay: {
      w: 620,
      h: 440,
      buttonY: 98
    },
    serviceConsole: {
      inset: .035,
      border: 12,
      titleY: 24,
      counterY: 51,
      meterY: 82,
      grilleWidth: 40,
      grilleCount: 7,
      dishX: .28,
      batchX: .72
    },
    status: {
      wideWidth: 610,

    },

    },

      floorY: .87,
      sideGaugeX: .11,
      sideGaugeY: .43
    }
  }
};
// Static local geometry for the shape-drawn chef (scaled by the scene's unit).
const CHEF = {
  tail: [[40, 101], [79, 126], [85, 164], [59, 181], [40, 168]],
  upperArm: [[-35, 35], [-88, 48], [-120, 8]],
  elbow: [-88, 48],
  wrist: [-120, 8],
  body: [
  ['box', -41, 95, 30, 92, 10, 'steel', 'black', 4],
  ['box', 12, 95, 30, 92, 10, 'steel', 'black', 4],
  ['box', -58, 175, 51, 24, 8, 'black', 'rim', 2],
  ['box', 7, 175, 51, 24, 8, 'black', 'rim', 2],
  ['box', -50, 13, 100, 108, 23, 'orange', 'black', 5],
  ['box', -32, 35, 65, 89, 7, 'text', 'rim', 3],
  ['box', -20, 74, 41, 28, 4, 'panel']
  ],
  head: [
  ['disc', -30, -73, 31, 'steel', 'black', 5], ['disc', -30, -73, 18, 'orange', 'rim', 2],
  ['disc', 39, -72, 27, 'steel', 'black', 5], ['disc', 39, -72, 14, 'orange'],
  ['box', -50, -77, 97, 91, 33, 'steel', 'black', 5],
  ['box', -66, -35, 61, 35, 15, 'rim', 'black', 4], ['disc', -71, -25, 10, 'black', 'amber', 2],
  ['box', -35, -60, 32, 15, 4, 'black'], ['disc', -25, -53, 5, 'amber']
  ],
  whiskers: [[[-59, -26], [-86, -40]], [[-59, -21], [-91, -23]]],
  mouth: [[-51, -15], [-13, -10]],
  hat: [
  ['box', -41, -109, 76, 35, 6, 'text', 'rim', 3],
  ['disc', -28, -111, 24, 'text', 'rim', 2], ['disc', 0, -124, 29, 'text', 'rim', 2],
  ['disc', 28, -111, 23, 'text', 'rim', 2], ['box', -42, -100, 79, 24, 4, 'text', 'rim', 2]
  ],
  hatSeam: [[-26, -88], [21, -88]],
  badge: {
    x: 0,
    y: 89,
    font: 21
  },
  neck: {
    x: 0,
    y: 22,
    r: 6
  }
};
const C = CONFIG.colors;
const canvas = document.getElementById('kitchen');
const ctx = canvas.getContext('2d');
const replay = document.getElementById('replay');
const announcement = document.getElementById('announcement');
const mute = document.getElementById('mute');
const coarseQuery = matchMedia('(pointer: coarse)');
let inputType = coarseQuery.matches ? 'touch' : 'keyboard';
const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
let reducedMotion = motionQuery.matches;
motionQuery.addEventListener('change', event => {
  reducedMotion = event.matches;
});
let view, scene, accumulator = 0, previousTime = 0;
const input = {
  space: false,
  pointers: new Set()
};
// Wording follows hardware capability and the last actual control input.
function touchUI() {
  return coarseQuery.matches || inputType === 'touch';
}

function setInputType(type) {
  inputType = type;
  Sound.refresh();
  updateInstructions();
  if (view) positionReplay();
}

function updateInstructions() {
  const instructions = document.getElementById('instructions');
  instructions.textContent = touchUI()
    ? 'Hold or tap anywhere to vent. Release to heat. Cook all five dishes. Tap Play again after a result.'
    : 'Hold Space or click anywhere to vent. Enter starts without venting. M toggles sound. Cook five dishes.';
  canvas.setAttribute('aria-label', instructions.textContent);
}

// AUDIO: optional, quiet synthesis; nothing is created before a user gesture.
function createSound() {
  const settings = CONFIG.sound;
  const notes = {
    combo: [660, 880],
    batch: [523, 659, 784],
    victory: [523, 659, 784, 1046],
    blowout: [95, 45],
    alarm: [440]
  };
  let muted = false;
  let graph = null;
  let unavailable = false;
  let alarmTime = 0;
  try {
    muted = localStorage.getItem(settings.storageKey) === 'true';
  } catch {
    // Sound works without persistent storage.
  }

  function label() {
    const shortcut = touchUI() ? '' : ' · M';
    mute.textContent = (muted ? 'Sound off' : 'Sound on') + shortcut;
    mute.setAttribute('aria-pressed', String(muted));
    const keyHint = touchUI() ? '' : ' (M)';
    mute.setAttribute('aria-label', `${muted ? 'Unmute' : 'Mute'} sound${keyHint}`);
  }

  function unlock() {
    if (muted || unavailable) return;
    try {
      if (!graph) {
        const Audio = window.AudioContext || window.webkitAudioContext;
        if (!Audio) {
          unavailable = true;
          return;
        }
        const audio = new Audio();
        const master = audio.createGain();
        master.gain.value = settings.volume;
        master.connect(audio.destination);
        const hiss = audio.createGain();
        hiss.gain.value = 0;
        hiss.connect(master);
        const filter = audio.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 1000;
        filter.connect(hiss);
        const noise = audio.createBufferSource();
        const buffer = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        noise.buffer = buffer;
        noise.loop = true;
        noise.connect(filter);
        noise.start();
        graph = { audio, master, hiss };
      }
      if (graph.audio.state === 'suspended') {
        Promise.resolve(graph.audio.resume()).catch(() => {});
      }
    } catch {
      unavailable = true;
      graph = null;
    }
  }

  function toggle() {
    muted = !muted;
    try {
      localStorage.setItem(settings.storageKey, String(muted));
    } catch {
      // Storage is optional.
    }
    try {
      if (graph) graph.master.gain.value = muted ? 0 : settings.volume;
    } catch {
      graph = null;
    }
    if (!muted) unlock();
    label();
  }

  function play(name) {
    if (!graph || muted) return;
    try {
      const { audio, master } = graph;
      notes[name].forEach((frequency, index) => {
        const start = audio.currentTime + index * settings.chimeSeconds;
        const duration = name === 'alarm' ? settings.beepSeconds : settings.chimeSeconds;
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.07, start + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
        oscillator.connect(gain);
        gain.connect(master);
        oscillator.start(start);
        oscillator.stop(start + duration + 0.02);
      });
    } catch {
      // Optional audio failure must never interrupt the simulation.
    }
  }

  function update(dt) {
    alarmTime = Math.max(0, alarmTime - dt);
    if (state.phase === 'cooking' && state.pressure >= CONFIG.warningPSI) {
      if (alarmTime === 0) {
        play('alarm');
        alarmTime = settings.alarmInterval;
      }
    } else {
      alarmTime = 0;
    }
    if (!graph) return;
    try {
      const volume = !muted && state.phase === 'cooking' ? state.lever ** CONFIG.ventCurve * settings.hissVolume : 0;
      graph.hiss.gain.setTargetAtTime(volume, graph.audio.currentTime, 0.04);
    } catch {
      graph = null;
    }
  }

  label();
  return { unlock, toggle, play, update, refresh: label };
}
const Sound = createSound();

// STATE
function readBest() {
  try {
    const best = Number(localStorage.getItem(CONFIG.storageKey));
    return Number.isFinite(best) ? Math.max(0, Math.floor(best)) : 0;
  } catch {
    return 0;
  }
}

function createState(best = readBest()) {
  return {
    ...KitchenPhysics.create(best),
    clock: 0,
    particles: [],
    emission: 0,
    resultTime: 0,
    flash: 0,
    shake: 0,
    ringPulse: 0,
    zoneFlash: 0,
    popText: '',
    popLife: 0,
    acted: false,
    hintOpacity: 1,
    celebrationTime: 0
  };
}
let state = createState();
function resetState() {
  state = createState(state.best);
  input.space = false;
  input.pointers.clear();
  replay.hidden = true;
  announcement.textContent = 'New service. Hold Space, click or touch anywhere to vent.';
}

function startCooking() {
  if (state.phase !== 'ready') return;
  state.phase = 'cooking';
  const seconds = KitchenPhysics.batch(state).seconds;
  announcement.textContent = `Batch 1 of 5. Hold the orange zone for ${seconds} cumulative seconds.`;
}

function blowout() {
  state.phase = 'gameover';
  state.pressure = CONFIG.maxPSI;
  state.flash = 1;
  state.best = Math.max(state.best, Math.floor(state.score));
  saveBest();
  Sound.play('blowout');
  emitSteam(CONFIG.burstParticleCount, true);
  state.shake = 1;
  state.ringPulse = 1;
  replay.hidden = true;
  announcement.textContent = `Valve blowout. Final score ${Math.floor(state.score)}. Best ${state.best}. Play again.`;
  positionReplay();
}
function saveBest() {
  try {
    localStorage.setItem(CONFIG.storageKey, String(state.best));
  } catch {
    // A blocked localStorage must not interrupt play.
  }
}

function celebrateBatch() {
  state.celebrationTime = CONFIG.celebrationSeconds;
  state.flash = 0.4;
  state.ringPulse = 1;
  emitSteam(CONFIG.pressPuffCount * 2, true);
  feedback('BATCH COOKED! +1 DISH', true);
  Sound.play(state.phase === 'victory' ? 'victory' : 'batch');
  if (state.phase === 'victory') {
    saveBest();
    replay.hidden = true;
    const score = Math.floor(state.score);
    announcement.textContent = `Service complete! ${state.dishes} dishes, score ${score}. Play again.`;
    positionReplay();
  }
}

function isResult() {
  return state.phase === 'gameover' || state.phase === 'victory';
}

// PHYSICS: fixed-step spring lever and damped pressure velocity.
function isVenting() {
  return input.space || input.pointers.size > 0;
}

function feedback(label, combo = false) {
  state.popText = label;
  state.popLife = CONFIG.feedbackDuration;
  state.ringPulse = 1;
  state.zoneFlash = combo ? 0.6 : 0.35;
  announcement.textContent = label;
}

function pressVent() {
  if (state.phase !== 'cooking' || isVenting()) return;
  state.acted = true;
  state.shake = 0.18;
  emitSteam(CONFIG.pressPuffCount);
}

function emitSteam(count, burst = false) {
  for (let i = 0; i < count && state.particles.length < CONFIG.particleLimit; i++) {
    const life = .6 + Math.random() * 1.2;
    state.particles.push({
      x: 0, y: 0, vx: (Math.random() - .2) * (burst ? 240 : 100),
      vy: -70 - Math.random() * (burst ? 300 : 130), life, maxLife: life,
      radius: 5 + Math.random() * (burst ? 22 : 10)
    });
  }
}

function updateSteam(dt) {
  if (state.phase === 'cooking' && state.lever > .1) {
    state.emission += dt * state.lever * 55;
    const count = Math.floor(state.emission);
    state.emission -= count;
    emitSteam(count);
  }
  for (const p of state.particles) {
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= Math.exp(-dt);
    p.radius += dt * 14;
  }
  state.particles = state.particles.filter(p => p.life > 0);
}

function update(dt) {
  state.clock += dt;
  const previousZone = state.inZone;
  const previousCombo = state.combo;
  const previousPhase = state.phase;
  const previousDishes = state.dishes;
  KitchenPhysics.step(state, dt, isVenting());
  if (state.dishes > previousDishes) {
    celebrateBatch();
  } else if (previousPhase === 'cooking' && state.phase === 'gameover') {
    blowout();
  } else if (previousPhase === 'batch' && state.phase === 'cooking') {
    feedback(`BATCH ${state.batchIndex + 1}/${CONFIG.batches.length} · HEAT LV ${state.batchIndex + 1}`, true);
  } else if (state.phase === 'cooking') {
    if (state.combo > previousCombo) {
      feedback(`COMBO ×${state.combo}!`, true);
      Sound.play('combo');
    } else if (state.inZone !== previousZone) {
      const correction = state.pressure > KitchenPhysics.batch(state).high ? 'TOO HOT · VENT' : 'HEAT IT UP';
      feedback(state.inZone ? 'SWEET SPOT!' : correction);
    }
  }
  if (isResult()) {
    state.resultTime += dt;
    replay.hidden = state.resultTime < CONFIG.overlayDelay;
  }
  state.flash = Math.max(0, state.flash - dt * 2.5);
  state.shake = Math.max(0, state.shake - dt * 1.8);
  state.ringPulse = Math.max(0, state.ringPulse - dt * 1.6);
  state.zoneFlash = Math.max(0, state.zoneFlash - dt);
  state.popLife = Math.max(0, state.popLife - dt);
  state.celebrationTime = Math.max(0, state.celebrationTime - dt);
  Sound.update(dt);
  if (state.acted) state.hintOpacity = Math.max(0, state.hintOpacity - dt * CONFIG.hintFadeSpeed);
  updateSteam(dt);
}
// INPUT: independent sources avoid stuck keys or a pointer overriding Space.
function activate() {
  if (isResult()) {
    if (state.resultTime < CONFIG.overlayDelay) return false;
    resetState();
  }
  startCooking();
  return true;
}

function keydown(event) {
  if (event.code === 'KeyM' && !event.repeat) {
    setInputType('keyboard');
    event.preventDefault();
    Sound.toggle();
    return;
  }
  if (event.target === replay) return;
  if (event.code !== 'Space' && event.code !== 'Enter') return;
  event.preventDefault();
  if (event.repeat) return;
  setInputType('keyboard');
  Sound.unlock();
  const restarting = isResult();
  if (!activate() || restarting) return;
  if (event.code === 'Space') {
    pressVent();
    input.space = true;
  }
}

function keyup(event) {
  if (event.code !== 'Space') return;
  // Focus can move while Space is held: always release the simulated input.
  input.space = false;
  // Suppress native Space activation of Mute, but preserve the replay button.
  if (event.target !== replay) event.preventDefault();
}

function pointerdown(event) {
  if (event.button !== 0) return;
  event.preventDefault();
  setInputType(event.pointerType === 'touch' ? 'touch' : 'mouse');
  Sound.unlock();
  if (isResult()) return;
  startCooking();
  pressVent();
  input.pointers.add(event.pointerId);
  canvas.focus({ preventScroll: true });
  canvas.setPointerCapture(event.pointerId);
}

function releasePointer(event) {
  input.pointers.delete(event.pointerId);
}

function releaseAll() {
  input.space = false;
  input.pointers.clear();
}

function bindInput() {
  window.addEventListener('keydown', keydown);
  window.addEventListener('keyup', keyup);
  canvas.addEventListener('pointerdown', pointerdown);
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);
  canvas.addEventListener('lostpointercapture', releasePointer);
  canvas.style.cursor = 'grab';
  mute.addEventListener('click', event => {
    // Keyboard activation is routed to gameplay; only pointer clicks toggle this button.
    if (event.detail === 0) return;
    setInputType(event.pointerType === 'touch' || coarseQuery.matches ? 'touch' : 'mouse');
    Sound.toggle();
    canvas.focus({ preventScroll: true });
  });
  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) releaseAll();
    accumulator = 0;
    previousTime = 0;
  });
  replay.addEventListener('click', () => {
    Sound.unlock();
    resetState();
    startCooking();
    canvas.focus();
  });
}
// LAYOUT AND DRAWING PRIMITIVES: scene coordinates scale uniformly with the viewport.
function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const layout = w / h < .9 ? CONFIG.layout.portrait : CONFIG.layout.landscape;
  const scale = Math.min(w / layout.w, h / layout.h);
  view = {
    w,
    h,
    dpr,
    scale,
    ox: 0,
    oy: 0
  };
  scene = {
    ...layout,
    w: w / scale,
    h: h / scale,
    unit: layout.machineScale,
    portrait: layout === CONFIG.layout.portrait
  };
  for (const key of ['podX', 'leverX', 'ratX']) scene[key] *= scene.w;
  for (const key of ['podY', 'leverY', 'ratY', 'headerY', 'footerY']) scene[key] *= scene.h;
  positionReplay();
}

function positionReplay() {
  if (!view) return;
  replay.textContent = touchUI() ? 'Tap to play again' : 'Play again';
  replay.style.top = `${view.oy + (scene.h / 2 + CONFIG.layout.overlay.buttonY) * view.scale}px`;
  replay.style.fontSize = `${Math.max(14, 17 * view.scale)}px`;
  replay.style.padding = `${Math.max(12, 15 * view.scale)}px ${Math.max(25, 34 * view.scale)}px`;
}

function rounded(x, y, w, h, r, fill, stroke, lineWidth = 2) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill();
  }
  if (stroke) {
    ctx.lineWidth = lineWidth;
    ctx.strokeStyle = stroke;
    ctx.stroke();
  }
}

function circle(x, y, r, fill, stroke, lineWidth = 2) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill();
  }
  if (stroke) {
    ctx.lineWidth = lineWidth;
    ctx.strokeStyle = stroke;
    ctx.stroke();
  }
}

function line(points, color, width = 2) {
  ctx.beginPath();
  points.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
}

function text(label, x, y, size = 16, color = C.text, align = 'left', weight = 'normal') {
  ctx.font = `${weight} ${size}px monospace`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x, y);
}

function local(x, y, scale, draw) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  draw();
  ctx.restore();
}

function rivet(x, y, r = 5) {
  circle(x, y, r, C.rim, C.black);
  line([[x - r / 2, y], [x + r / 2, y]], C.panel, 1.5);
}

function pressureAngle(psi) {
  return CONFIG.layout.gauge.start + psi / CONFIG.maxPSI * CONFIG.layout.gauge.sweep;
}

function arc(radius, start, end, color, width) {
  ctx.beginPath();
  ctx.arc(0, 0, radius, start, end);
  ctx.lineWidth = width;
  ctx.strokeStyle = color;
  ctx.stroke();
}
// ROOM: architectural piping, wall plates, lamps and floor reflections.
function drawRoom() {
  const { w, h } = scene;
  const room = CONFIG.layout.room;
  const light = ctx.createRadialGradient(w * .46, h * .48, 0, w * .46, h * .48, w * .75);
  light.addColorStop(0, '#71351C');
  light.addColorStop(1, C.bg);
  ctx.fillStyle = light;
  ctx.fillRect(0, 0, w, h);
  for (let i = 1; i < room.columns; i++) {
    const x = w * i / room.columns;
    line([[x, h * .22], [x, h * room.floorY]], C.seam, 1);
    for (let j = 2; j < room.rows; j++) rivet(x, h * j / room.rows, 2.5);
  }
  const inset = w * room.pipeInset;
  const top = h * .235;
  const bottom = h * .80;
  const pipe = [[inset, bottom], [inset, top], [w * .28, top], [w * .28, h * .34]];
  line(pipe, C.black, 32);
  line(pipe, C.steel, 24);
  line(pipe, C.rim, 3);
  const rightPipe = [[w * .97, h * .24], [w * .97, bottom], [w * .69, bottom]];
  line(rightPipe, C.black, 38);
  line(rightPipe, C.seam, 29);
  line(rightPipe, C.rim, 2);
  for (let i = 0; i < 5; i++) drawPipeCollar(inset, top + (bottom - top) * i / 5);
  rounded(0, h * room.floorY, w, h * (1 - room.floorY), 0, C.dark, C.steel);
  for (let i = 0; i < room.columns; i++) line([[w / 2, h * room.floorY], [w * i / 6, h]], C.seam);
  drawFloorConsole();
  drawRoomLights();
  drawWallInstruments();
  drawAmbientSteam();
}

// The floor doubles as the boiler's return-line service console.
function drawFloorConsole() {
  const { w, h, portrait } = scene;
  const g = CONFIG.layout.serviceConsole;
  const floor = h * CONFIG.layout.room.floorY;
  const panelTop = floor + g.border;
  const panelHeight = h - panelTop - g.border;
  rounded(w * g.inset, panelTop, w * (1 - 2 * g.inset), panelHeight, 10, C.panel, C.rim, 3);
  rounded(w * .05, panelTop + 10, w * .90, panelHeight - 20, 6, C.dark, C.seam, 2);
  for (const side of [.075, .925]) {
    rivet(w * side, panelTop + 22, 4);
    rivet(w * side, h - 35, 4);
    const grilleX = w * side - g.grilleWidth / 2;
    const grilleCount = portrait ? g.grilleCount : 3;
    const grilleTop = portrait ? 48 : 35;
    const grilleSpan = Math.max(12, panelHeight - grilleTop - 35);
    for (let i = 0; i < grilleCount; i++) {
      const y = panelTop + grilleTop + i * grilleSpan / grilleCount;
      rounded(grilleX, y, g.grilleWidth, 7, 3, C.black, C.steel, 1);
    }
  }
  text('SERVICE / RETURN LINE', w * .5, panelTop + g.titleY, portrait ? 17 : 12, C.amber, 'center', 'bold');
  text(`DISHES ${state.dishes}/${CONFIG.batches.length}`,
    w * g.dishX, panelTop + g.counterY, portrait ? 20 : 16, C.text, 'center', 'bold');
  text(`BATCH ${state.batchIndex + 1}/${CONFIG.batches.length}`,
    w * g.batchX, panelTop + g.counterY, portrait ? 20 : 16, C.amber, 'center', 'bold');
  if (portrait) drawVentMeter(panelTop + g.meterY);
  line([[w * .15, panelTop + 49], [w * .15, h - 26], [w * .29, h - 26]], C.steel, 7);
  line([[w * .85, panelTop + 49], [w * .85, h - 26], [w * .71, h - 26]], C.steel, 7);
}

function drawVentMeter(y) {
  const w = scene.w;
  const meterWidth = w * .48;
  rounded(w * .26, y, meterWidth, 19, 3, C.black, C.steel);
  for (let i = 0; i < 18; i++) {
    const lit = i < Math.round(state.lever * 18);
    rounded(w * .26 + 5 + i * (meterWidth - 10) / 18, y + 4,
      (meterWidth - 10) / 18 - 4, 11, 1, lit ? C.amber : C.seam);
  }
}

function drawRoomLights() {
  const { w, h, portrait, podX, podY } = scene;
  const glow = ctx.createRadialGradient(podX, podY - 70, 20, podX, podY, 510);
  glow.addColorStop(0, 'rgba(255,179,92,0.25)');
  glow.addColorStop(0.6, 'rgba(240,90,24,0.13)');
  glow.addColorStop(1, 'rgba(240,90,24,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, w, h);
  for (const side of [0.08, 0.92]) {
    const x = w * side;
    const y = h * (portrait ? 0.26 : 0.31);
    const halo = ctx.createRadialGradient(x, y, 0, x, y, 155);
    halo.addColorStop(0, 'rgba(255,179,92,0.3)');
    halo.addColorStop(1, 'rgba(240,90,24,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(x - 155, y - 155, 310, 310);
    rounded(x - 28, y - 13, 56, 26, 6, C.black, C.rim);
    rounded(x - 20, y - 6, 40, 12, 3, C.amber);
    line([[x, y + 15], [x, y + 72]], C.rim, 5);
  }
  const railY = h * (portrait ? 0.65 : 0.83);
  line([[w * 0.04, railY], [w * 0.96, railY]], C.black, 20);
  line([[w * 0.04, railY], [w * 0.96, railY]], C.steel, 12);
  line([[w * 0.04, railY - 3], [w * 0.96, railY - 3]], C.amber, 2);
  const signY = h * (portrait ? 0.21 : 0.34);
  text('CAUTION / LIVE STEAM', w * 0.5, signY, portrait ? 16 : 12, C.amber, 'center');
  if (portrait) {
    const instructionY = scene.podY + 300 * scene.unit;
    if (isResult()) return;
    text('KEEP THE NEEDLE IN ORANGE', w * 0.5, instructionY, 19, C.amber, 'center', 'bold');
    text('TAP = TRIM / HOLD = COOL / RELEASE = HEAT', w * 0.5, instructionY + 32, 14, C.muted, 'center');
  }
}

function drawPipeCollar(x, y) {
  rounded(x - 22, y - 7, 44, 14, 2, C.steel, C.black);
  rivet(x - 16, y, 3);
  rivet(x + 16, y, 3);
}

function drawWallInstruments() {
  const { w, h, portrait } = scene;
  const x = w * .12;
  const y = h * (portrait ? .70 : .47);
  rounded(x - 65, y - 110, 130, 235, 8, C.panel, C.steel);
  local(x, y - 35, .35, () => drawDial(110, (state.batchIndex + 1) / CONFIG.batches.length * CONFIG.maxPSI, false));
  text('BURNER', x, y + 30, 12, C.muted, 'center');
  for (let i = 0; i < CONFIG.batches.length; i++) {
    rounded(x - 42, y + 54 + i * 11, 84, 5, 1, i <= state.batchIndex ? C.orange : C.seam);
  }
  const ventX = w * .83;
  const ventY = h * .28;
  rounded(ventX - 80, ventY - 35, 160, 80, 5, C.dark, C.steel);
  for (let i = 0; i < 6; i++) line([[ventX - 62, ventY - 20 + i * 11], [ventX + 62, ventY - 20 + i * 11]], C.seam, 5);
  text('EXHAUST', ventX, ventY + 67, 12, C.muted, 'center');
}

function drawAmbientSteam() {
  const { w, h } = scene;
  ctx.save();
  for (let i = 0; i < 5; i++) {
    const drift = reducedMotion ? i / 5 : (state.clock * .025 + i / 5) % 1;
    ctx.globalAlpha = Math.sin(drift * Math.PI) * .045;
    ctx.beginPath();
    ctx.ellipse(w * (.12 + i * .19), h * (.9 - drift * .3), w * .08, h * .025, -.2, 0, Math.PI * 2);
    ctx.fillStyle = C.text;
    ctx.fill();
  }
  ctx.restore();
}
// POD
function drawPod() {
  const g = CONFIG.layout.pod;
  const danger = state.pressure >= CONFIG.warningPSI && state.phase === 'cooking';
  const shake = reducedMotion ? 0 : Math.sin(state.clock * 65) * (state.shake * 12 + (danger ? 2.4 : 0));
  local(scene.podX + shake, scene.podY, scene.unit, () => {
    drawPodPlumbing();
    rounded(-g.w / 2 + 35, g.h / 2 - 40, 85, 65, 8, C.steel, C.black, 5);
    rounded(g.w / 2 - 120, g.h / 2 - 40, 85, 65, 8, C.steel, C.black, 5);
    const metal = ctx.createLinearGradient(-g.w / 2, 0, g.w / 2, 0);
    metal.addColorStop(0, C.panel);
    metal.addColorStop(.4, '#956B4B');
    metal.addColorStop(1, C.panel);
    rounded(-g.w / 2, -g.h / 2, g.w, g.h, g.radius, metal, C.black, 12);
    rounded(-g.w / 2 + 12, -g.h / 2 + 12, g.w - 24, g.h - 24, g.radius - 6, null, C.rim, 2);
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) rivet(sx * (g.w / 2 - 40), sy * (g.h / 2 - 55), 7);
    drawFurnace();
    drawGauge();
    drawWarningLamp(danger);
    rounded(-91, g.h / 2 - 54, 182, 27, 3, C.dark, C.rim);
    text('GASKET / UNIT 01', 0, g.h / 2 - 40, 13, C.amber, 'center');
  });
}

function drawPodPlumbing() {
  const g = CONFIG.layout.pod;
  line([[-g.w / 2, 30], [-g.w / 2 - 55, 30], [-g.w / 2 - 55, 185], [-g.w / 2, 185]], C.black, 44);
  line([[-g.w / 2, 30], [-g.w / 2 - 55, 30], [-g.w / 2 - 55, 185], [-g.w / 2, 185]], C.steel, 28);
  line([[g.w / 2 - 70, -g.h / 2], [g.valveX - 30, g.valveY], [g.valveX, g.valveY]], C.black, 38);
  line([[g.w / 2 - 70, -g.h / 2], [g.valveX - 30, g.valveY], [g.valveX, g.valveY]], C.rim, 25);
  const lift = state.phase === 'gameover' ? -Math.min(150, state.resultTime * 280) : -state.lever * 8;
  rounded(g.valveX - 18, g.valveY - 18 + lift, 42, 12, 3, C.orange, C.amber);
}

function drawFurnace() {
  const g = CONFIG.layout.pod;
  const y = g.h * .28;
  rounded(-g.w * .35, y - 22, g.w * .7, 58, 14, C.black, C.rim, 3);
  ctx.save();
  ctx.shadowColor = C.orange;
  ctx.shadowBlur = 17;
  for (let i = 0; i < 11; i++) {
    const flicker = reducedMotion ? .7 : .7 + Math.sin(state.clock * 5 + i * 2) * .25;
    rounded(-g.w * .31 + i * g.w * .059, y - 13, g.w * .035, 40 * flicker, 4, i % 2 ? C.amber : C.orange);
  }
  ctx.restore();
}

function drawWarningLamp(danger) {
  const g = CONFIG.layout.pod;
  const on = danger && Math.sin(state.clock * 12) > 0;
  const x = -g.w / 2 + 38;
  const y = -g.h / 2 + 110;
  circle(x, y, 13, C.black, C.rim);
  ctx.save();
  ctx.shadowColor = C.red;
  ctx.shadowBlur = on ? 26 : 0;
  circle(x, y, 8, on ? C.red : C.seam);
  ctx.restore();
}
// GAUGE: calibrated 270 degree dial; target arc is exactly 65–85 PSI.
function drawGauge() {
  const g = CONFIG.layout.pod;
  local(0, g.gaugeY, 1, () => drawDial(g.gaugeR, state.pressure, true));
}

function drawDial(r, psi, main) {
  const g = CONFIG.layout.gauge;
  if (main && state.ringPulse > 0) {
    ctx.save();
    ctx.globalAlpha = state.ringPulse;
    circle(0, 0, r + 18 + (1 - state.ringPulse) * 20, null, C.amber, 4);
    ctx.restore();
  }
  circle(0, 0, r + 12, C.black, C.rim, 4);
  circle(0, 0, r, C.dark, main && state.inZone ? C.orange : C.steel, 8);
  arc(r * .79, g.start, g.start + g.sweep, C.seam, r * .105);
  const target = KitchenPhysics.batch(state);
  if (main) {
    arc(r * .79, pressureAngle(target.low), pressureAngle(target.high), C.orange, r * .105);
    arc(r * .79, pressureAngle(CONFIG.warningPSI), pressureAngle(CONFIG.maxPSI), C.red, r * .055);
  } else {
    arc(r * .79, g.start, pressureAngle(psi), C.orange, r * .105);
  }
  drawDialTicks(r, main);
  if (main && state.popLife > 0 && !isResult()) {
    const g = CONFIG.layout.popup;
    ctx.save();
    ctx.globalAlpha = Math.min(1, state.popLife * 3);
    text(state.popText, 0, r * g.y, g.font, C.amber, 'center', 'bold');
    ctx.restore();
  }
  text(main ? 'POD PRESSURE' : 'BURNER', 0, -r * .34, r * .075, C.muted, 'center');
  const readout = main ? psi.toFixed(0) : `${state.batchIndex + 1}/${CONFIG.batches.length}`;
  const readoutColor = main && state.inZone ? C.amber : C.text;
  text(readout, 0, r * .39, r * .25, readoutColor, 'center', 'bold');
  text(main ? 'PSI' : 'LEVEL / 5', 0, r * .60, r * .085, C.muted, 'center');
  drawNeedle(r, psi, main);
  const bandLabel = `${target.low}–${target.high} PSI${state.inZone ? ` · ×${state.combo}` : ''}`;
  if (main) text(bandLabel, 0, r * .87, r * .08, C.amber, 'center');
}

function drawDialTicks(r, main) {
  const g = CONFIG.layout.gauge;
  const ticks = main ? g.tickCount : CONFIG.batches.length;
  for (let i = 0; i <= ticks; i++) {
    const psi = i / ticks * CONFIG.maxPSI;
    const a = pressureAngle(psi);
    const major = !main || i % 5 === 0;
    const outer = r * .9;
    const inner = r * (major ? .79 : .85);
    const mark = [[Math.cos(a) * inner, Math.sin(a) * inner], [Math.cos(a) * outer, Math.sin(a) * outer]];
    line(mark, C.muted, major ? 2 : 1);
    if (major) text(String(main ? psi : i), Math.cos(a) * r * .66, Math.sin(a) * r * .66, r * .072, C.text, 'center');
  }
}

function drawNeedle(r, psi, main) {
  const a = pressureAngle(psi);
  ctx.save();
  ctx.rotate(a);
  ctx.shadowColor = main && state.pressure >= CONFIG.warningPSI ? C.red : C.orange;
  ctx.shadowBlur = main ? (state.inZone ? 20 : 9) : 0;
  ctx.beginPath();
  ctx.moveTo(-r * .14, -r * .026);
  ctx.lineTo(r * .75, 0);
  ctx.lineTo(-r * .14, r * .026);
  ctx.closePath();
  ctx.fillStyle = C.amber;
  ctx.fill();
  ctx.restore();
  circle(0, 0, r * .075, C.orange, C.amber, 3);
}
// GASKET: a canvas-built robot rat chef, reaching toward the lever.
function drawGasket(x = scene.ratX, y = scene.ratY, scale = scene.unit, celebrating = false) {
  const bounce = celebrating && !reducedMotion ? Math.max(0, Math.sin(state.resultTime * 6)) * 8 : 0;
  local(x, y - bounce, scale, () => {
    drawRatBody();
    if (celebrating) drawCelebratingArms();
    else drawWorkingArms();
    drawArtwork(CHEF.head);
    line(CHEF.mouth, C.black, 3);
    CHEF.whiskers.forEach(points => line(points, C.muted));
    drawChefHat();
  });
}

function drawWorkingArms() {
  line(CHEF.upperArm, C.black, 24);
  line(CHEF.upperArm, C.rim, 14);
  circle(...CHEF.elbow, 11, C.steel, C.amber);
  const handX = (scene.leverX - scene.ratX) / scene.unit + leverTip().x;
  const handY = (scene.leverY - scene.ratY) / scene.unit + leverTip().y;
  line([CHEF.wrist, [handX, handY]], C.steel, 12);
  circle(handX, handY, 12, C.rim, C.black, 3);
}

function drawCelebratingArms() {
  for (const side of [-1, 1]) {
    const arm = [[side * 35, 35], [side * 75, -10], [side * 95, -70]];
    line(arm, C.black, 24);
    line(arm, C.rim, 14);
    circle(side * 95, -70, 12, C.amber, C.black, 3);
  }
}

function drawArtwork(shapes) {
  for (const [kind, ...args] of shapes) {
    const colorIndex = kind === 'box' ? 5 : 3;
    args[colorIndex] = C[args[colorIndex]];
    args[colorIndex + 1] = C[args[colorIndex + 1]];
    if (kind === 'box') rounded(...args);
    else circle(...args);
  }
}

function drawRatBody() {
  line(CHEF.tail, C.black, 14);
  line(CHEF.tail, C.rim, 7);
  drawArtwork(CHEF.body);
  const badge = CHEF.badge;
  const neck = CHEF.neck;
  text('G', badge.x, badge.y, badge.font, C.amber, 'center', 'bold');
  rivet(neck.x, neck.y, neck.r);
}

function drawChefHat() {
  drawArtwork(CHEF.hat);
  line(CHEF.hatSeam, C.muted, 2);
}
// LEVER
function leverTip() {
  const g = CONFIG.layout.lever;
  const a = g.rest + state.lever * g.travel;
  return {
    x: Math.sin(a) * g.arm,
    y: g.pivotY - Math.cos(a) * g.arm
  };
}

function drawLever() {
  const g = CONFIG.layout.lever;
  const kind = touchUI() ? 'touch' : inputType;
  const control = kind === 'keyboard' ? 'HOLD SPACE'
    : kind === 'touch' ? 'HOLD / TAP' : 'HOLD CLICK';
  const key = kind === 'keyboard' ? '[ SPACE ]'
    : kind === 'touch' ? '[ TOUCH ]' : '[ CLICK ]';
  local(scene.leverX, scene.leverY, scene.unit, () => {
    rounded(-g.w / 2, -g.h / 2, g.w, g.h, 12, C.black, C.steel, 4);
    for (const side of [-1, 1]) rivet(side * g.w * .36, g.h * .39, 5);
    arcLeverTrack(g);
    const tip = leverTip();
    line([[0, g.pivotY], [tip.x, tip.y]], C.black, 22);
    line([[0, g.pivotY], [tip.x, tip.y]], C.rim, 12);
    circle(0, g.pivotY, 21, C.steel, C.rim, 3);
    rivet(0, g.pivotY, 9);
    rounded(tip.x - 36, tip.y - 14, 72, 28, 10, isVenting() ? C.amber : C.orange, C.black, 4);
    if (isResult()) return;
    text(state.lever > .5 ? 'VENTING' : control, 0, g.h / 2 + 27, scene.portrait ? 20 : 14, C.amber, 'center', 'bold');
    text(key, 0, g.h / 2 + 51, scene.portrait ? 17 : 13, C.muted, 'center');
  });
}

function arcLeverTrack(g) {
  ctx.save();
  ctx.translate(0, g.pivotY);
  arc(g.arm * .66, -Math.PI / 2 + g.rest, -Math.PI / 2 + g.rest + g.travel, C.orange, 4);
  ctx.restore();
}

function drawSteam() {
  const g = CONFIG.layout.pod;
  local(scene.podX + g.valveX * scene.unit, scene.podY + g.valveY * scene.unit, scene.unit, () => {
    for (const p of state.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife) * .46;
      circle(p.x, p.y, p.radius, C.text);
    }
    ctx.globalAlpha = 1;
  });
}
// HUD AND PHASE OVERLAYS
function drawHUD() {
  drawHeader();
  drawBatchStatus();
  drawControlHint();

}

function drawBatchStatus() {
  const { w, h, portrait } = scene;
  const g = CONFIG.layout.status;
  const target = KitchenPhysics.batch(state);
  const x = w * (portrait ? .5 : .43);
  const y = h * (portrait ? .164 : .23);
  const width = portrait ? g.tallWidth : g.wideWidth;
  const height = state.phase === 'ready' ? (portrait ? 86 : 52) : (portrait ? 64 : 42);
  const critical = state.phase === 'cooking' && state.pressure >= CONFIG.warningPSI;
  let label = `BUILD PRESSURE · TARGET ${target.low}–${target.high} PSI`;
  if (state.inZone) label = `IN ZONE ×${state.combo} / +${CONFIG.pointsPerSecond * state.combo} PTS/SEC`;
  if (state.pressure > target.high) label = 'TOO HOT · HOLD TO VENT';
  if (state.surgeWarning) label = `SURGE INCOMING · TARGET ${target.low}–${target.high} PSI`;
  if (critical) label = state.surgeWarning ? 'CRITICAL · VENT NOW · SURGE INCOMING' : 'CRITICAL PRESSURE · VENT NOW';
  if (state.phase === 'batch') label = `BATCH COOKED! · NEXT: HEAT LV ${state.batchIndex + 2}`;
  if (state.phase === 'victory') label = 'SERVICE COMPLETE · ALL FIVE DISHES COOKED';
  if (state.phase === 'gameover') label = `BATCH ${state.batchIndex + 1} LOST · VALVE BLOWOUT`;
  rounded(x - width / 2, y - height / 2, width, height, 4, C.dark, critical ? C.red : C.orange);
  if (state.phase === 'ready') {
    const start = touchUI() ? 'HOLD OR TAP ANYWHERE TO VENT' : 'HOLD SPACE OR CLICK TO VENT';
    text(start, x, y - 12, portrait ? 23 : 16, C.amber, 'center', 'bold');
    const help = touchUI() ? 'TOUCH TO START · RELEASE TO HEAT'
      : 'PRESS TO START · ENTER STARTS WITHOUT VENTING';
    text(help, x, y + 15, portrait ? 17 : 12, C.text, 'center');
  } else {
    text(label, x, y, portrait ? 22 : 15, critical ? C.red : C.amber, 'center', 'bold');
  }
  const progressY = y + height / 2 + g.progressGap;
  const progress = state.cookTime / target.seconds;
  rounded(x - width / 2, progressY, width, g.progressHeight, 2, C.seam);
  if (progress > 0) rounded(x - width / 2, progressY, width * progress, g.progressHeight, 2, C.amber);
  const progressLabel = `BATCH ${state.batchIndex + 1}/${CONFIG.batches.length} · `
    + `${state.cookTime.toFixed(1)}/${target.seconds}s IN ZONE · TARGET ${target.low}–${target.high}`;
  text(progressLabel, x, progressY + g.captionGap, portrait ? 18 : 12, C.text, 'center');
}

function drawControlHint() {
  if (isResult() || state.hintOpacity <= 0) return;
  // A dark plaque in the open wall space, clear of the floor console and lever.
  const x = scene.w * (scene.portrait ? .46 : .14);
  const y = scene.h * (scene.portrait ? .665 : .69);
  const width = scene.portrait ? 470 : 300;
  const hint = touchUI() ? 'HOLD / TAP ANYWHERE TO VENT'
    : inputType === 'mouse' ? 'HOLD CLICK ANYWHERE TO VENT' : 'HOLD SPACE TO VENT';
  ctx.save();
  ctx.globalAlpha = state.hintOpacity;
  rounded(x - width / 2, y - 21, width, 42, 4, C.dark, C.rim);
  text(hint, x, y - 5, scene.portrait ? 18 : 14, C.text, 'center');
  text('RELEASE TO HEAT', x, y + 12, 11, C.amber, 'center');
  ctx.restore();
}

function drawHeader() {
  const { w, headerY, portrait } = scene;
  const left = w * .055;
  text('GASKET’S', left, headerY, portrait ? 22 : 19, C.amber, 'left', 'bold');
  text('PRESSURE KITCHEN', left, headerY + 39, portrait ? 38 : 42, C.text, 'left', 'bold');
  text('A LITTLE HEAT. A LOT OF NERVE.', left, headerY + 76, 12, C.muted);
  const sx = w * (portrait ? .70 : .79);
  const sy = headerY + 8;
  text('SERVICE SCORE', sx, sy, 12, C.amber);
  text(Math.floor(state.score).toString().padStart(6, '0'), sx, sy + 36, portrait ? 34 : 39, C.text, 'left', 'bold');
  text(`BEST ${state.best.toString().padStart(6, '0')}`, sx, sy + 71, 12, C.muted);
  line([[left, headerY + 106], [w * .945, headerY + 106]], C.steel);
  if (!portrait) drawHeatReadout();
}

function drawHeatReadout() {
  const x = scene.w * .79;
  const y = scene.h * .385;
  text('BOILER STATUS', x, y, 12, C.muted, 'center');
  const labels = {
    cooking: '● FIRED UP',
    ready: '● STANDBY',
    gameover: '● VALVE BLOWN',
    victory: '● SERVICE DONE',
    batch: '● DISH READY'
  };
  text(labels[state.phase], x, y + 27, 17, C.orange, 'center', 'bold');
  text(`HEAT LV ${state.batchIndex + 1}  /  ${state.elapsed.toFixed(1)}s`, x, y + 54, 12, C.amber, 'center');
}

function drawGameOver() {
  if (!isResult() || state.resultTime < CONFIG.overlayDelay) return;
  if (state.phase === 'victory') {
    drawVictory();
    return;
  }
  const g = CONFIG.layout.overlay;
  const x = scene.w / 2;
  const y = scene.h / 2;
  ctx.fillStyle = 'rgba(13,9,8,.84)';
  ctx.fillRect(0, 0, scene.w, scene.h);
  rounded(x - g.w / 2, y - g.h / 2, g.w, g.h, 10, C.dark, C.orange, 2);
  text(`BATCH ${state.batchIndex + 1} · VALVE BLOWOUT`, x, y - 155, 18, C.orange, 'center', 'bold');
  text('GAME OVER', x, y - 97, 52, C.text, 'center', 'bold');
  const summary = `${state.dishes}/${CONFIG.batches.length} dishes · ${state.elapsed.toFixed(1)}s service`;
  text(summary, x, y - 48, 17, C.muted, 'center');
  text('FINAL SCORE', x - 125, y + 4, 13, C.amber, 'center');
  text('PERSONAL BEST', x + 125, y + 4, 13, C.amber, 'center');
  text(Math.floor(state.score).toString().padStart(6, '0'), x - 125, y + 43, 33, C.text, 'center', 'bold');
  text(state.best.toString().padStart(6, '0'), x + 125, y + 43, 33, C.text, 'center', 'bold');
  text(touchUI() ? 'TAP TO PLAY AGAIN' : 'or press SPACE / ENTER',
    x, y + 190, 13, C.muted, 'center');
}

// Victory has a warmer, wider layout and a continuing celebration of its own.
function drawVictory() {
  const g = CONFIG.layout.victory;
  const x = scene.w / 2;
  const y = scene.h / 2;
  ctx.fillStyle = 'rgba(13,9,8,.46)';
  ctx.fillRect(0, 0, scene.w, scene.h);
  const glow = ctx.createRadialGradient(x, y, 20, x, y, g.w * .8);
  glow.addColorStop(0, 'rgba(255,179,92,.45)');
  glow.addColorStop(1, 'rgba(240,90,24,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, scene.w, scene.h);
  drawVictorySparkles(x, y);
  ctx.save();
  ctx.shadowColor = C.amber;
  ctx.shadowBlur = reducedMotion ? 12 : 28;
  rounded(x - g.w / 2, y - g.h / 2, g.w, g.h, 20, '#3C2110', C.amber, 4);
  ctx.restore();
  text('SERVICE COMPLETE', x, y + g.titleY, 45, C.amber, 'center', 'bold');
  text(`ALL FIVE DISHES COOKED · ${state.elapsed.toFixed(1)}s`,
    x, y + g.titleY + 43, 17, C.text, 'center');
  for (let i = 0; i < CONFIG.batches.length; i++) {
    const lit = reducedMotion || state.resultTime - CONFIG.overlayDelay >= i * g.lightDelay;
    drawServedDish(x + (i - 2) * g.dishSpacing, y + g.dishY, lit);
  }
  drawFinalScores(x, y + g.scoreY);
  drawGasket(x + g.chefX, y + g.chefY, g.chefScale, true);
  text('GASKET’S SPECIAL: FIVE FOR FIVE!', x + 65, y + 70, 15, C.amber, 'center', 'bold');
  text(touchUI() ? 'TAP TO PLAY AGAIN' : 'PLAY AGAIN · SPACE / ENTER',
    x + 45, y + 210, 14, C.text, 'center');
}

function drawFinalScores(x, y) {
  const columns = [
    { x: x - 125, label: 'FINAL SCORE', value: Math.floor(state.score) },
    { x: x + 125, label: 'PERSONAL BEST', value: state.best }
  ];
  for (const column of columns) {
    text(column.label, column.x, y, 13, C.amber, 'center');
    text(String(column.value).padStart(6, '0'), column.x, y + 37, 33, C.text, 'center', 'bold');
  }
}

function drawServedDish(x, y, lit) {
  const radius = CONFIG.layout.victory.dishRadius;
  local(x, y, 1, () => {
    circle(0, 0, radius + 7, lit ? C.orange : C.dark, lit ? C.amber : C.steel, 3);
    ctx.beginPath();
    ctx.arc(0, radius * .15, radius * .7, Math.PI, Math.PI * 2);
    ctx.fillStyle = lit ? C.amber : C.steel;
    ctx.fill();
    line([[-radius * .85, radius * .25], [radius * .85, radius * .25]],
      lit ? C.text : C.rim, 4);
    circle(0, -radius * .6, radius * .1, lit ? C.text : C.rim);
  });
}

function drawVictorySparkles(x, y) {
  const g = CONFIG.layout.victory;
  const time = reducedMotion ? 1 : state.resultTime;
  ctx.save();
  for (let i = 0; i < g.sparkleCount; i++) {
    const travel = (time * .17 + i * .137) % 1;
    const angle = i * 2.4;
    const distance = g.w * (.3 + travel * .5);
    const px = x + Math.cos(angle) * distance;
    const py = y + Math.sin(angle) * distance * .75;
    ctx.globalAlpha = Math.sin(travel * Math.PI) * .7;
    const color = i % 2 ? C.amber : C.orange;
    line([[px - 5, py], [px + 5, py]], color, 3);
    line([[px, py - 5], [px, py + 5]], color, 3);
    if (i % 3 === 0) circle(px, py - 20, 10 + travel * 16, 'rgba(255,179,92,.12)');
  }
  ctx.restore();
}

function drawPressureBurst() {
  const lost = state.phase === 'gameover' && state.resultTime < CONFIG.overlayDelay;
  if (!lost && state.celebrationTime <= 0) return;
  const g = CONFIG.layout.burst;
  const progress = lost ? state.resultTime / CONFIG.overlayDelay
    : 1 - state.celebrationTime / CONFIG.celebrationSeconds;
  const spread = reducedMotion ? .3 : progress;
  local(scene.podX, scene.podY + CONFIG.layout.pod.gaugeY * scene.unit, scene.unit, () => {
    ctx.globalAlpha = (1 - progress) * (reducedMotion ? .3 : 1);
    circle(0, 0, g.radius + spread * g.expansion, null, C.amber, 15 * (1 - spread) + 1);
    for (let i = 0; i < g.spokes; i++) {
      const angle = i * Math.PI * 2 / g.spokes;
      const inner = g.radius + spread * g.expansion / 2;
      const outer = inner + g.rayLength + spread * g.rayLength * 2;
      line([[Math.cos(angle) * inner, Math.sin(angle) * inner], [Math.cos(angle) * outer, Math.sin(angle) * outer]],
        i % 2 ? C.orange : C.amber, lost ? 4 : 2);
    }
  });
}

function render() {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  drawRoom();
  ctx.save();
  if (!reducedMotion && state.shake > 0) {
    ctx.translate(Math.sin(state.clock * 71) * state.shake * 6, Math.cos(state.clock * 53) * state.shake * 4);
  }
  drawPod();
  drawLever();
  if (state.phase !== 'victory') drawGasket();
  drawSteam();
  ctx.restore();
  drawPressureBurst();
  if (state.zoneFlash > 0) {
    ctx.fillStyle = `rgba(255,179,92,${state.zoneFlash * (reducedMotion ? 0.035 : 0.09)})`;
    ctx.fillRect(0, 0, scene.w, scene.h);
  }
  drawHUD();
  drawGameOver();
  if (state.flash > 0) {
    ctx.fillStyle = `rgba(255,179,92,${state.flash * (reducedMotion ? .12 : .65)})`;
    ctx.fillRect(0, 0, scene.w, scene.h);
  }
}

function frame(timestamp) {
  if (!previousTime) previousTime = timestamp;
  accumulator += Math.min(CONFIG.maxFrame, (timestamp - previousTime) / 1000);
  previousTime = timestamp;
  while (accumulator >= CONFIG.step) {
    update(CONFIG.step);
    accumulator -= CONFIG.step;
  }
  render();
  requestAnimationFrame(frame);
}
bindInput();
updateInstructions();
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
