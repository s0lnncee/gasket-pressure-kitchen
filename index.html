<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gasket's Pressure Kitchen</title>
<style>
  :root {
    --bg: #0D0908;
    --panel: #140D0B;
    --text: #F3EEE9;
    --muted: #A8968C;
    --heat: #F05A18;
    --amber: #FFB35C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
  body { font: 16px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: pointer; outline: none; }
  .overlay {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(13, 9, 8, 0.78);
  }
  .overlay[hidden] { display: none; }
  .card {
    width: min(440px, calc(100vw - 32px)); padding: 28px 28px 24px; text-align: center;
    background: var(--panel); border: 2px solid #3A2620; border-top: 4px solid var(--heat); border-radius: 10px;
    box-shadow: 0 0 60px rgba(240, 90, 24, 0.18);
  }
  .card h1, .card h2 { margin: 0 0 6px; letter-spacing: 0.06em; text-transform: uppercase; }
  .card h1 { font-size: 26px; color: var(--amber); }
  .card h2 { font-size: 30px; color: var(--heat); }
  .card p { margin: 8px 0; color: var(--muted); }
  .card .big { font-size: 44px; color: var(--text); margin: 10px 0 2px; }
  .card kbd { padding: 1px 6px; border: 1px solid #5A4038; border-radius: 4px; color: var(--text); }
  .card button {
    margin-top: 18px; padding: 12px 26px; font: inherit; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--bg); background: var(--heat); border: 0; border-radius: 6px; cursor: pointer;
  }
  .card button:hover { background: var(--amber); }
  .card button:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Gasket's Pressure Kitchen: hold Space or the lever to vent steam"></canvas>

<div class="overlay" id="start">
  <div class="card">
    <h1>Gasket's Pressure Kitchen</h1>
    <p>The pod is cooking and the pressure keeps climbing.</p>
    <p>Hold <kbd>Space</kbd> or hold the lever to vent steam. Keep the needle in the orange zone, <strong>65–85 PSI</strong>, to score. Stay in it to build a multiplier.</p>
    <p>At <strong>100 PSI</strong> the valve blows.</p>
    <button type="button" id="start-btn">Start cooking</button>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="card" role="dialog" aria-labelledby="over-title">
    <h2 id="over-title">Game Over</h2>
    <p>Valve blowout at 100 PSI.</p>
    <p class="big" id="final-score">0</p>
    <p id="final-detail"></p>
    <button type="button" id="again-btn">Play again</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---- Tuning -------------------------------------------------------------
  const MAX_PSI = 100;
  const ZONE_LOW = 65;
  const ZONE_HIGH = 85;
  const DANGER = 92;
  const START_PSI = 45;
  const STEP = 1 / 120;            // fixed simulation step (s)
  const VENT_FLOW = 36;            // PSI/s through a fully open valve at 100 PSI
  const LEVER_OPEN_RATE = 7;       // lever travel per second when pulled
  const LEVER_CLOSE_RATE = 4.5;    // lever spring-back per second when released
  const POINTS_PER_SECOND = 10;
  const MULT_EVERY = 4;            // seconds in zone per multiplier step
  const MULT_MAX = 5;

  // ---- Palette (no blue or purple) ---------------------------------------
  const C = {
    bg: '#0D0908',
    panel: '#140D0B',
    panelHi: '#1E1411',
    line: '#3A2620',
    metal: '#4A3A33',
    metalHi: '#6E5A50',
    metalLo: '#2A1E1A',
    text: '#F3EEE9',
    muted: '#A8968C',
    heat: '#F05A18',
    amber: '#FFB35C',
    danger: '#E0301E',
    steam: '#F3EEE9',
  };

  // ---- Pure simulation ----------------------------------------------------
  // Heat input rises with time cooked and a little with pressure (it boils harder when hot).
  function heatRate(t, p) {
    return (5 + Math.min(t, 150) * 0.075) * (0.85 + p / 300);
  }
  // Steam escapes faster the higher the pressure (orifice flow ~ sqrt of pressure).
  function ventRate(lever, p) {
    return VENT_FLOW * lever * Math.sqrt(Math.max(p, 0) / MAX_PSI);
  }
  function inZone(p) {
    return p >= ZONE_LOW && p <= ZONE_HIGH;
  }
  function multiplierFor(streak) {
    return Math.min(MULT_MAX, 1 + Math.floor(streak / MULT_EVERY));
  }

  function newState() {
    return {
      mode: 'ready',          // ready | playing | over
      t: 0,                   // seconds cooked
      p: START_PSI,
      needle: START_PSI,      // displayed needle, follows p with a little inertia
      needleV: 0,
      lever: 0,               // 0 closed .. 1 fully open
      score: 0,
      streak: 0,              // seconds continuously in zone
      bestStreak: 0,
      zoneTime: 0,
      surge: null,            // { warn, left, rate }
      nextSurge: 7,
      shake: 0,
      blowT: 0,
    };
  }

  function step(s, dt, held, rand) {
    s.lever += held ? Math.min(1 - s.lever, LEVER_OPEN_RATE * dt) : -Math.min(s.lever, LEVER_CLOSE_RATE * dt);

    let dp = heatRate(s.t, s.p) - ventRate(s.lever, s.p);

    // Boil surges: a short warning, then a burst of extra pressure.
    s.nextSurge -= dt;
    if (!s.surge && s.nextSurge <= 0) {
      const size = 7 + rand() * 6 + Math.min(s.t, 120) * 0.05;
      s.surge = { warn: 0.7, left: 1.1, rate: size / 1.1 };
      s.nextSurge = 6 + rand() * 7;
    }
    if (s.surge) {
      if (s.surge.warn > 0) s.surge.warn -= dt;
      else {
        dp += s.surge.rate;
        s.surge.left -= dt;
        if (s.surge.left <= 0) s.surge = null;
      }
    }

    s.p = Math.max(0, s.p + dp * dt);
    s.t += dt;

    if (inZone(s.p)) {
      s.streak += dt;
      s.zoneTime += dt;
      s.bestStreak = Math.max(s.bestStreak, s.streak);
      s.score += POINTS_PER_SECOND * multiplierFor(s.streak) * dt;
    } else {
      s.streak = 0;
    }

    if (s.p >= MAX_PSI) {
      s.p = MAX_PSI;
      s.mode = 'over';
    }
  }

  // Needle: critically damped spring toward the true pressure, so it moves smoothly but stays honest.
  function stepNeedle(s, dt) {
    const k = 260, d = 2 * Math.sqrt(k);
    s.needleV += (k * (s.p - s.needle) - d * s.needleV) * dt;
    s.needle += s.needleV * dt;
    s.needle = Math.max(0, Math.min(MAX_PSI + 2, s.needle));
  }

  // ---- DOM, input ---------------------------------------------------------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const startEl = document.getElementById('start');
  const overEl = document.getElementById('over');
  const startBtn = document.getElementById('start-btn');
  const againBtn = document.getElementById('again-btn');
  const finalScore = document.getElementById('final-score');
  const finalDetail = document.getElementById('final-detail');

  let best = 0;
  try { best = Number(localStorage.getItem('gasket:best')) || 0; } catch (e) { best = 0; }

  let s = newState();
  const input = { key: false, pointer: false };
  const held = () => input.key || input.pointer;

  function start() {
    s = newState();
    s.mode = 'playing';
    particles.length = 0;
    input.key = false;
    input.pointer = false;
    startEl.hidden = true;
    overEl.hidden = true;
    canvas.focus();
  }

  function gameOver() {
    const score = Math.floor(s.score);
    const isBest = score > best;
    if (isBest) {
      best = score;
      try { localStorage.setItem('gasket:best', String(best)); } catch (e) { /* storage unavailable */ }
    }
    finalScore.textContent = score.toLocaleString('en-US');
    finalDetail.textContent = (isBest ? 'New best! ' : 'Best ' + best.toLocaleString('en-US') + ' · ') +
      'cooked ' + s.t.toFixed(1) + ' s, longest streak ' + s.bestStreak.toFixed(1) + ' s';
    burst(POD.x, POD.y - POD.h / 2 - 20, 140, 520);
    s.shake = 0.9;
    // Let the blowout play before the dialog covers it.
    setTimeout(() => {
      if (s.mode !== 'over') return;
      overEl.hidden = false;
      againBtn.focus();
    }, 650);
  }

  startBtn.addEventListener('click', start);
  againBtn.addEventListener('click', start);

  window.addEventListener('keydown', (e) => {
    if (e.code !== 'Space' && e.key !== ' ') return;
    if (s.mode !== 'playing') return; // on a dialog, Space presses the focused button
    e.preventDefault();
    if (!e.repeat) input.key = true;
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.key === ' ') input.key = false;
  });

  canvas.addEventListener('pointerdown', (e) => {
    if (s.mode !== 'playing') return;
    e.preventDefault();
    input.pointer = true;
    canvas.setPointerCapture(e.pointerId);
  });
  const release = () => { input.pointer = false; };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('lostpointercapture', release);
  window.addEventListener('blur', () => { input.key = false; input.pointer = false; });

  // ---- Layout -------------------------------------------------------------
  // Two design spaces, letterboxed into the window: landscape, and portrait for phones.
  const LAYOUTS = {
    wide: {
      W: 1280, H: 720,
      pod: { x: 640, y: 420, w: 330, h: 300 },
      lever: { x: 330, y: 560, len: 150 },
      gasket: { x: 190, y: 470 },
      hud: { x: 930, y: 150, w: 300 },
      pipeY: 120, lampY: 60,
    },
    tall: {
      W: 720, H: 1280,
      pod: { x: 400, y: 700, w: 330, h: 300 },
      lever: { x: 230, y: 1060, len: 150 },
      gasket: { x: 100, y: 970 },
      hud: { x: 60, y: 40, w: 600 },
      pipeY: 420, lampY: 470,
    },
  };
  let L = LAYOUTS.wide, W = L.W, H = L.H, POD = L.pod, LEVER = L.lever;
  let GAUGE = { x: POD.x, y: POD.y, r: 118 };
  let view = { scale: 1, ox: 0, oy: 0, dpr: 1 };

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = window.innerWidth, ch = window.innerHeight;
    L = cw / ch < 0.8 ? LAYOUTS.tall : LAYOUTS.wide;
    W = L.W; H = L.H; POD = L.pod; LEVER = L.lever;
    GAUGE = { x: POD.x, y: POD.y, r: 118 };
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    const scale = Math.min(cw / W, ch / H);
    view = { scale, ox: (cw - W * scale) / 2, oy: (ch - H * scale) / 2, dpr };
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- Particles (steam) --------------------------------------------------
  const particles = [];
  function puff(x, y, vx, vy, life, size) {
    if (particles.length > 600) return;
    particles.push({ x, y, vx, vy, life, max: life, size });
  }
  function burst(x, y, n, speed) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = speed * (0.3 + Math.random() * 0.7);
      puff(x, y, Math.cos(a) * v, Math.sin(a) * v - 120, 0.8 + Math.random() * 0.8, 10 + Math.random() * 22);
    }
  }
  function stepParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const q = particles[i];
      q.life -= dt;
      if (q.life <= 0) { particles.splice(i, 1); continue; }
      q.vx *= 1 - 1.6 * dt;
      q.vy = q.vy * (1 - 1.6 * dt) - 60 * dt;
      q.x += q.vx * dt;
      q.y += q.vy * dt;
      q.size += 26 * dt;
    }
  }
  function emitSteam(dt) {
    const valveX = POD.x + 92, valveY = POD.y - POD.h / 2 - 34;
    const flow = s.mode === 'playing' ? ventRate(s.lever, s.p) : 0;
    let n = flow * dt * 2.2;
    while (n > 0) {
      if (n >= 1 || Math.random() < n) {
        puff(valveX + 6, valveY, 140 + Math.random() * 120, -40 - Math.random() * 90, 0.6 + Math.random() * 0.5, 6 + Math.random() * 8);
      }
      n -= 1;
    }
    // A thin wisp from the lid seam when the pod runs hot.
    if (s.mode === 'playing' && s.p > ZONE_HIGH && Math.random() < (s.p - ZONE_HIGH) * dt * 1.5) {
      puff(POD.x - 120 + Math.random() * 240, POD.y - POD.h / 2 + 6, (Math.random() - 0.5) * 30, -50, 0.7, 5);
    }
  }

  // ---- Drawing helpers ----------------------------------------------------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function text(str, x, y, size, color, align = 'left', weight = '400') {
    ctx.font = `${weight} ${size}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }
  function rivet(x, y) {
    ctx.fillStyle = C.metalHi;
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
  }
  // Gauge angle: 0 PSI at 225deg (bottom left), 100 PSI at -45deg (bottom right), clockwise.
  const A0 = Math.PI * 0.75, SWEEP = Math.PI * 1.5;
  const angleFor = (psi) => A0 + (psi / MAX_PSI) * SWEEP;

  // ---- Scene --------------------------------------------------------------
  function drawRoom(time) {
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, W, H);
    // Wall panels.
    ctx.strokeStyle = '#1A110E';
    ctx.lineWidth = 2;
    for (let x = 0; x <= W; x += 160) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H - 120); ctx.stroke(); }
    for (let y = 0; y <= H - 120; y += 120) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    // Heat glow behind the pod, stronger with pressure.
    const heat = Math.min(1, s.needle / MAX_PSI);
    const g = ctx.createRadialGradient(POD.x, POD.y, 40, POD.x, POD.y, 460);
    g.addColorStop(0, `rgba(240, 90, 24, ${0.08 + heat * 0.22})`);
    g.addColorStop(1, 'rgba(240, 90, 24, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // Pipes.
    ctx.lineCap = 'round';
    ctx.strokeStyle = C.metalLo; ctx.lineWidth = 22;
    ctx.beginPath(); ctx.moveTo(0, L.pipeY); ctx.lineTo(POD.x + 92, L.pipeY); ctx.lineTo(POD.x + 92, POD.y - POD.h / 2 - 40); ctx.stroke();
    ctx.strokeStyle = C.metal; ctx.lineWidth = 14;
    ctx.stroke();
    ctx.lineCap = 'butt';
    // Floor.
    ctx.fillStyle = '#100B09';
    ctx.fillRect(0, H - 120, W, 120);
    ctx.fillStyle = C.line;
    ctx.fillRect(0, H - 120, W, 3);
    // Hazard stripes on the floor edge.
    ctx.save();
    ctx.beginPath(); ctx.rect(0, H - 117, W, 10); ctx.clip();
    for (let x = -20; x < W + 20; x += 28) {
      ctx.fillStyle = 'rgba(240, 90, 24, 0.35)';
      ctx.beginPath(); ctx.moveTo(x, H - 107); ctx.lineTo(x + 14, H - 117); ctx.lineTo(x + 24, H - 117); ctx.lineTo(x + 10, H - 107); ctx.fill();
    }
    ctx.restore();
    // Alarm lamp, blinking in the danger band.
    const alarm = s.mode === 'playing' && s.p >= DANGER && Math.floor(time * 6) % 2 === 0;
    ctx.fillStyle = alarm ? C.danger : '#3A1A12';
    ctx.beginPath(); ctx.arc(POD.x, L.lampY, 16, 0, Math.PI * 2); ctx.fill();
    if (alarm) {
      ctx.fillStyle = 'rgba(224, 48, 30, 0.12)';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawPod() {
    const { x, y, w, h } = POD;
    const top = y - h / 2;
    // Legs.
    ctx.fillStyle = C.metalLo;
    ctx.fillRect(x - w / 2 + 30, y + h / 2 - 10, 26, 60);
    ctx.fillRect(x + w / 2 - 56, y + h / 2 - 10, 26, 60);
    // Body.
    const body = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
    body.addColorStop(0, '#2A1E1A');
    body.addColorStop(0.45, '#5A4840');
    body.addColorStop(1, '#22180F');
    ctx.fillStyle = body;
    roundRect(x - w / 2, top, w, h, 46);
    ctx.fill();
    ctx.strokeStyle = C.line; ctx.lineWidth = 3; ctx.stroke();
    // Bands with rivets.
    for (const by of [top + 30, y + h / 2 - 30]) {
      ctx.fillStyle = C.metalLo;
      ctx.fillRect(x - w / 2 + 4, by - 8, w - 8, 16);
      for (let rx = x - w / 2 + 24; rx < x + w / 2 - 10; rx += 34) rivet(rx, by);
    }
    // Lid and valve stack.
    ctx.fillStyle = C.metal;
    roundRect(x - w / 2 + 20, top - 24, w - 40, 30, 12); ctx.fill();
    ctx.fillStyle = C.metalLo;
    ctx.fillRect(x + 80, top - 48, 24, 26);
    ctx.fillStyle = s.lever > 0.05 ? C.amber : C.metalHi;
    ctx.fillRect(x + 76, top - 54, 32, 8);
    // Pod label, on the lid.
    text('POD-01', x - w / 2 + 40, top - 9, 14, C.bg, 'left', '700');
  }

  function drawGauge() {
    const { x, y, r } = GAUGE;
    // Bezel.
    ctx.fillStyle = C.metalLo;
    ctx.beginPath(); ctx.arc(x, y, r + 16, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.metalHi; ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = '#120C0A';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();

    // Target zone and danger band.
    ctx.lineWidth = 16;
    ctx.strokeStyle = 'rgba(240, 90, 24, 0.9)';
    ctx.beginPath(); ctx.arc(x, y, r - 18, angleFor(ZONE_LOW), angleFor(ZONE_HIGH)); ctx.stroke();
    ctx.strokeStyle = 'rgba(224, 48, 30, 0.85)';
    ctx.beginPath(); ctx.arc(x, y, r - 18, angleFor(DANGER), angleFor(MAX_PSI)); ctx.stroke();

    // Ticks and labels.
    for (let v = 0; v <= MAX_PSI; v += 5) {
      const a = angleFor(v), major = v % 20 === 0;
      const r1 = r - 4, r2 = r - (major ? 30 : 14);
      ctx.strokeStyle = major ? C.text : C.muted;
      ctx.lineWidth = major ? 3 : 1.5;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1);
      ctx.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2);
      ctx.stroke();
      if (major) text(String(v), x + Math.cos(a) * (r - 48), y + Math.sin(a) * (r - 48), 15, C.text, 'center', '700');
    }
    text('PSI', x, y + 38, 14, C.muted, 'center', '700');

    // Digital readout.
    const p = s.p;
    const color = p >= DANGER ? C.danger : inZone(p) ? C.heat : C.text;
    ctx.fillStyle = '#0A0706';
    roundRect(x - 44, y + 54, 88, 30, 5); ctx.fill();
    text(p.toFixed(1), x, y + 70, 20, color, 'center', '700');

    // Needle, with a tremor that grows with heat input.
    const tremor = s.mode === 'playing' ? Math.sin(performance.now() / 23) * heatRate(s.t, s.p) * 0.015 : 0;
    const a = angleFor(Math.min(MAX_PSI + 1.5, s.needle + tremor));
    ctx.strokeStyle = C.amber; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - Math.cos(a) * 16, y - Math.sin(a) * 16);
    ctx.lineTo(x + Math.cos(a) * (r - 20), y + Math.sin(a) * (r - 20));
    ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.fillStyle = C.metalHi;
    ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.fill();
  }

  function leverHandle() {
    // Upright when closed, pulled down toward the operator when open.
    const a = -Math.PI / 2 + 0.35 + s.lever * 1.0;
    return { a, hx: LEVER.x + Math.cos(a) * LEVER.len, hy: LEVER.y + Math.sin(a) * LEVER.len };
  }

  function drawLever() {
    const { hx, hy } = leverHandle();
    // Base plate.
    ctx.fillStyle = C.metalLo;
    roundRect(LEVER.x - 50, LEVER.y - 10, 100, 60, 8); ctx.fill();
    ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.stroke();
    rivet(LEVER.x - 38, LEVER.y + 38); rivet(LEVER.x + 38, LEVER.y + 38);
    text('VENT', LEVER.x, LEVER.y + 24, 13, C.muted, 'center', '700');
    // Pipe to the pod valve.
    ctx.strokeStyle = C.metal; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(LEVER.x + 50, LEVER.y + 20);
    if (LEVER.y + 20 > POD.y + POD.h / 2 + 40) {   // lever well below the pod: run the pipe up into its base
      ctx.lineTo(POD.x - 60, LEVER.y + 20); ctx.lineTo(POD.x - 60, POD.y + POD.h / 2);
    } else {
      ctx.lineTo(POD.x - POD.w / 2, LEVER.y + 20);
    }
    ctx.stroke();
    // Arm.
    ctx.strokeStyle = C.metalHi; ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(LEVER.x, LEVER.y); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.lineCap = 'butt';
    // Knob, glowing while held.
    ctx.fillStyle = held() && s.mode === 'playing' ? C.amber : C.heat;
    ctx.beginPath(); ctx.arc(hx, hy, 18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.metalHi;
    ctx.beginPath(); ctx.arc(LEVER.x, LEVER.y, 10, 0, Math.PI * 2); ctx.fill();
  }

  // Gasket: the pod's operator, a stout kitchen bot with amber goggles, one hand on the lever.
  function drawGasket(time) {
    const { hx, hy } = leverHandle();
    const bx = L.gasket.x, by = L.gasket.y;
    const bob = Math.sin(time * 2) * 2;
    const worried = s.mode === 'playing' && s.p >= DANGER;
    // Body and apron.
    ctx.fillStyle = '#3A2A24';
    roundRect(bx - 54, by - 30 + bob, 108, 150, 26); ctx.fill();
    ctx.fillStyle = '#2A1E1A';
    roundRect(bx - 38, by + 10 + bob, 76, 104, 12); ctx.fill();
    text('G', bx, by + 52 + bob, 28, C.heat, 'center', '700');
    // Legs.
    ctx.fillStyle = C.metalLo;
    ctx.fillRect(bx - 40, by + 118, 26, 52);
    ctx.fillRect(bx + 14, by + 118, 26, 52);
    // Arm reaching for the lever knob.
    const sx = bx + 46, sy = by + 6 + bob;
    const ex = (sx + hx) / 2 + 10, ey = Math.max(sy, hy) + 24;
    ctx.strokeStyle = '#3A2A24'; ctx.lineWidth = 18; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(ex, ey, hx - 6, hy + 4); ctx.stroke();
    ctx.lineCap = 'butt';
    // Head.
    const hy0 = by - 76 + bob + (worried ? Math.sin(time * 40) * 1.5 : 0);
    ctx.fillStyle = '#4A3A33';
    roundRect(bx - 46, hy0 - 40, 92, 80, 24); ctx.fill();
    // Chef hat, scorched at the rim.
    ctx.fillStyle = C.text;
    roundRect(bx - 36, hy0 - 82, 72, 46, 18); ctx.fill();
    ctx.fillStyle = '#C9BDB4';
    ctx.fillRect(bx - 36, hy0 - 46, 72, 8);
    // Goggles.
    for (const gx of [bx - 20, bx + 20]) {
      ctx.fillStyle = C.metalLo;
      ctx.beginPath(); ctx.arc(gx, hy0 - 4, 15, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = worried ? C.danger : C.amber;
      ctx.beginPath(); ctx.arc(gx, hy0 - 4, 10, 0, Math.PI * 2); ctx.fill();
    }
    // Mouth: grin in the zone, flat outside, open when it is about to blow.
    ctx.strokeStyle = C.text; ctx.lineWidth = 3;
    ctx.beginPath();
    if (worried) { ctx.arc(bx, hy0 + 24, 7, 0, Math.PI * 2); }
    else if (inZone(s.p)) { ctx.arc(bx, hy0 + 14, 14, 0.2 * Math.PI, 0.8 * Math.PI); }
    else { ctx.moveTo(bx - 12, hy0 + 24); ctx.lineTo(bx + 12, hy0 + 24); }
    ctx.stroke();
  }

  function drawParticles() {
    for (const q of particles) {
      const k = q.life / q.max;
      ctx.fillStyle = `rgba(243, 238, 233, ${0.35 * k})`;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawHud(time) {
    const { x, y, w } = L.hud;
    ctx.fillStyle = C.panel;
    roundRect(x, y, w, 330, 10); ctx.fill();
    ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = C.heat; ctx.fillRect(x, y, w, 4);

    text('SCORE', x + 22, y + 32, 14, C.muted, 'left', '700');
    text(Math.floor(s.score).toLocaleString('en-US'), x + 22, y + 70, 40, C.text, 'left', '700');

    const mult = inZone(s.p) ? multiplierFor(s.streak) : 1;
    text('MULTIPLIER', x + 22, y + 116, 14, C.muted, 'left', '700');
    text('x' + mult, x + 22, y + 146, 28, mult > 1 ? C.amber : C.text, 'left', '700');
    // Progress to the next multiplier step.
    const prog = mult >= MULT_MAX ? 1 : (s.streak % MULT_EVERY) / MULT_EVERY;
    ctx.fillStyle = '#2A1E1A'; ctx.fillRect(x + 110, y + 140, w - 132, 12);
    ctx.fillStyle = inZone(s.p) ? C.heat : '#5A4038';
    ctx.fillRect(x + 110, y + 140, (w - 132) * prog, 12);

    text('COOKED', x + 22, y + 192, 14, C.muted, 'left', '700');
    text(s.t.toFixed(1) + ' s', x + 22, y + 220, 22, C.text, 'left', '700');
    text('BEST', x + 160, y + 192, 14, C.muted, 'left', '700');
    text(best.toLocaleString('en-US'), x + 160, y + 220, 22, C.text, 'left', '700');

    // Status line.
    let status = 'TOO LOW: LET IT COOK', col = C.muted;
    if (s.mode === 'over') { status = 'VALVE BLOWOUT'; col = C.danger; }
    else if (s.surge && s.surge.warn > 0) { status = 'SURGE INCOMING'; col = C.amber; }
    else if (s.p >= DANGER) { status = 'DANGER: VENT NOW'; col = C.danger; }
    else if (s.p > ZONE_HIGH) { status = 'TOO HOT: VENT'; col = C.amber; }
    else if (inZone(s.p)) { status = 'COOKING: IN ZONE'; col = C.heat; }
    const blink = (status === 'SURGE INCOMING' || status.startsWith('DANGER')) && Math.floor(time * 5) % 2;
    ctx.fillStyle = '#0A0706';
    roundRect(x + 16, y + 258, w - 32, 50, 6); ctx.fill();
    if (!blink) text(status, x + w / 2, y + 283, 17, col, 'center', '700');

    text('Hold SPACE or the lever to vent', W / 2, H - 50, 16, C.muted, 'center');
  }

  function draw(time) {
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const shakeX = s.shake > 0 ? (Math.random() - 0.5) * 24 * s.shake : 0;
    const shakeY = s.shake > 0 ? (Math.random() - 0.5) * 24 * s.shake : 0;
    ctx.setTransform(
      view.dpr * view.scale, 0, 0, view.dpr * view.scale,
      view.dpr * (view.ox + shakeX), view.dpr * (view.oy + shakeY)
    );
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    drawRoom(time);
    drawPod();
    drawGauge();
    drawLever();
    drawGasket(time);
    drawParticles();
    drawHud(time);
    ctx.restore();
  }

  // ---- Loop ---------------------------------------------------------------
  let last = performance.now();
  let acc = 0;
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1;           // a hidden tab or a stall does not fast-forward the game
    if (s.mode === 'playing') {
      acc += dt;
      while (acc >= STEP) {
        step(s, STEP, held(), Math.random);
        acc -= STEP;
        if (s.mode === 'over') { acc = 0; gameOver(); break; }
      }
    } else {
      acc = 0;
    }
    stepNeedle(s, dt);
    if (s.shake > 0) s.shake = Math.max(0, s.shake - dt);
    emitSteam(dt);
    stepParticles(dt);
    draw(now / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Pause when the tab is hidden: release the lever so it does not stay open.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { input.key = false; input.pointer = false; }
  });

  // Read-only hook for anyone checking the game from the console.
  Object.defineProperty(window, 'gasket', { get: () => ({ mode: s.mode, psi: s.p, score: Math.floor(s.score), lever: s.lever }) });
})();
</script>
</body>
</html>
